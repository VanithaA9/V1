<!DOCTYPE html>
<html>
<head>
    <title>Personal Details</title>
</head>
<body>

    <h2>Enter Your Details</h2>

    <form id="detailsForm">
        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>
<label>Gender:</label><br>

<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label><br>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label><br>

<input type="radio" id="other" name="gender" value="Other">
<label for="other">Other</label>
<br><br>

        <label>Height:</label>
        <input type="number" id="height" required>
        <br><br>

        <label>Weight:</label>
        <input type="number" id="weight" required>
        <br><br>

        <label>Phone:</label>
        <input type="tel" id="phone" required>
        <br><br>
<label for="fathername">Father's Name:</label><br>
<input type="text" id="fathername" name="fathername" placeholder="Enter father's name">

<br><br>

<label for="mothername">Mother's Name:</label><br>
<input type="text" id="mothername" name="mothername" placeholder="Enter mother's name">

        <button type="submit">Display</button>
    </form>

    <h2>Entered Details</h2>
    <div id="result"></div>

    <script>
        document.getElementById("detailsForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let height = document.getElementById("height").value;
            let weight = document.getElementById("weight").value;
            let phone = document.getElementById("phone").value;

            document.getElementById("result").innerHTML =
                "Name: " + name + "<br>" +
                "Height: " + height + " cm<br>" +
                "Weight: " + weight + " kg<br>" +
                "Phone: " + phone;
        });
<label for="address">Address:</label><br>
<textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address"></textarea>
    </script>

</body>
</html>
